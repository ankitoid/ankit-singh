name: Deploy Vite App to S3

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the code
      - name: 📦 Checkout Repository
        uses: actions/checkout@v2

      # 2. Setup Node.js (use your project's Node version)
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 3. Install project dependencies
      - name: 📁 Install Dependencies
        run: npm ci

      # 4. Build the Vite app (output goes to `dist/`)
      - name: 🛠️ Build Vite App
        run: npm run build

      # 5. Configure AWS credentials
      - name: 🔐 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # 6. Sync the `dist/` folder to your S3 bucket
      - name: 🚀 Deploy to S3
        run: aws s3 sync dist/ s3://ankit-singh-s3 --delete 