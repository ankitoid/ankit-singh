<!doctype html>
<html lang="en">
<head>
  <!-- Basic -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ankit Singh | Full Stack Developer | React & Node.js</title>

  <!-- Primary SEO -->
  <meta name="description" content="Ankit Singh - Full Stack Developer specializing in React, Node.js, Cloud Architecture and scalable web applications. Explore my portfolio, projects, and experience." />
  <meta name="keywords" content="Ankit Singh, Full Stack Developer, React Developer, Node.js Developer, Portfolio, Cloud Architecture, JavaScript Developer" />
  <meta name="author" content="Ankit Singh" />
  <meta name="robots" content="index, follow" />

  <!-- Canonical URL (CHANGE THIS TO YOUR DOMAIN) -->
  <link rel="canonical" href="https://yourdomain.com/" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/favicon.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">

  <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
  <meta property="og:title" content="Ankit Singh | Full Stack Developer" />
  <meta property="og:description" content="Portfolio of Ankit Singh - Full Stack Developer building scalable web applications with React, Node.js & Cloud." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://yourdomain.com/" />
  <meta property="og:image" content="https://yourdomain.com/preview.png" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Ankit Singh | Full Stack Developer" />
  <meta name="twitter:description" content="Explore my portfolio, projects and experience in Full Stack Development." />
  <meta name="twitter:image" content="https://yourdomain.com/preview.png" />

  <!-- Theme Color -->
  <meta name="theme-color" content="#020202" />

  <!-- Structured Data (VERY IMPORTANT FOR SEO) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Ankit Singh",
    "url": "https://yourdomain.com",
    "jobTitle": "Full Stack Developer",
    "sameAs": [
      "https://github.com/yourusername",
      "https://linkedin.com/in/yourprofile"
    ],
    "knowsAbout": [
      "React",
      "Node.js",
      "JavaScript",
      "Cloud Architecture",
      "MySQL"
    ]
  }
  </script>

  <!-- Global Styles -->
  <style>
    body {
      margin: 0;
      background-color: #020202e1;
      font-family: 'Montserrat', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
